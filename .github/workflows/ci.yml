name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.12 quality and publication gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[demo,dev]"

      - name: Public-repository boundary
        run: python scripts/check_publication.py

      - name: Release-candidate source contract
        run: python scripts/check_release_candidate.py

      - name: Exact-commit release repository contract
        run: python scripts/check_release_repository.py

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src tests

      - name: Pytest with coverage
        env:
          OPENAI_API_KEY: ""
        run: pytest --cov=financial_rag --cov-report=term-missing --cov-report=xml -q

  postgres-integration:
    name: PostgreSQL 17 and pgvector migration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm
        env:
          POSTGRES_DB: financial_rag_test
          POSTGRES_USER: financial_rag_test
          POSTGRES_PASSWORD: integration_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financial_rag_test -d financial_rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://financial_rag_test:integration_only@127.0.0.1:5432/financial_rag_test
      DATABASE_URL: postgresql+asyncpg://financial_rag_test:integration_only@127.0.0.1:5432/financial_rag_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Apply Alembic migrations
        run: python -m alembic upgrade head

      - name: Run infrastructure tests
        run: pytest -m integration -q

  dependency-audit:
    name: Python dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[security]"

      - name: Audit installed Python dependencies
        run: python -m pip_audit --strict .

  container-build:
    name: Container build checks
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build lightweight API image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          push: false
          tags: financial-rag-api:ci

      - name: Build CPU model-enabled API image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api-models
          push: false
          tags: financial-rag-api-models:ci
          cache-from: type=gha,scope=financial-rag-api-models
          cache-to: type=gha,mode=max,scope=financial-rag-api-models

      - name: Build Streamlit image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: demo
          push: false
          tags: financial-rag-demo:ci
